name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # allow manual trigger from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Keep old /brief/ GitHub links
        run: |
          mkdir -p brief/brief
          cat > brief/brief/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0;url=../">
          <link rel="canonical" href="https://subnetbriefs.com/">
          <title>Subnet Brief</title>
          <script>location.replace('../')</script>
          <p><a href="../">Subnet Brief</a></p>
          EOF

      - name: Upload Brief
        uses: actions/upload-pages-artifact@v3
        with:
          # Public site is Brief at the domain root. Other apps stay in git.
          path: 'brief'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
