name: Refresh Home news

on:
  schedule:
    - cron: "20 12,19 * * *"
  workflow_dispatch:
  # First merge of this file never registered it. A push that touches
  # the workflow is enough for GitHub to start running it.

permissions:
  contents: write

concurrency:
  group: home-news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull TAO Daily
        run: python3 .github/scripts/refresh_home_news.py

      - name: Commit if the list moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief/news.json
          if git diff --cached --quiet; then
            echo "No news change"
            exit 0
          fi
          git commit -m "Refresh Home news from TAO Daily"
          git push
