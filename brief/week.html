<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>This week in TAO · X card</title>
<meta name="robots" content="noindex">
<style>
  :root { --ink:#ece7dc; --mute:#9a9284; --gold:#c4a35a; --bg:#0a0c10; --line:#2a2e36; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100dvh; padding:20px 16px 32px;
    background:var(--bg); color:var(--ink);
    font:16px/1.45 ui-sans-serif, system-ui, sans-serif;
  }
  h1 { font-family:Georgia, serif; font-size:28px; font-weight:600; margin:0 0 8px; }
  p { color:var(--mute); margin:0 0 16px; }
  img { display:block; width:100%; max-width:720px; height:auto; border:1px solid var(--line); border-radius:12px; }
  a.save {
    display:inline-block; margin:16px 8px 0 0; padding:12px 16px;
    background:var(--gold); color:#1a1408; font-weight:700;
    text-decoration:none; border-radius:12px;
  }
  a.jpg { background:#ece7dc; }
  a.back { display:inline-block; margin-top:18px; color:var(--gold); }
</style>
</head>
<body>
  <h1>Save this for X</h1>
  <p>GitHub’s picture page has no Save. Open this in Nova, press and hold the card, or tap Download PNG.</p>
  <img src="./tao_week_x_card.png" alt="This week in TAO" width="1600" height="900">
  <p>
    <a class="save" href="./tao_week_x_card.png" download="tao_week_x_card.png">Download PNG</a>
    <a class="save jpg" href="./tao_week_x_card.jpg" download="tao_week_x_card.jpg">Download JPG</a>
  </p>
  <a class="back" href="./">← Subnet Brief</a>
</body>
</html>
