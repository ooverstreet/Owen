<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gamma X card · Subnet Brief</title>

<style>
  :root { --ink:#ece7dc; --mute:#9a9284; --gold:#c4a35a; --bg:#0a0c10; --paper:#14171c; --line:#2a2e36; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100dvh; padding:20px 16px 32px;
    background:var(--bg); color:var(--ink);
    font:16px/1.45 ui-sans-serif, system-ui, sans-serif;
  }
  h1 { font-family:Georgia, serif; font-size:28px; font-weight:600; margin:0 0 8px; }

  img {
    display:block; width:100%; max-width:720px; height:auto;
    border:1px solid var(--line); border-radius:12px;
  }
  a.save {
    display:inline-block; margin:16px 0 0; padding:12px 16px;
    background:var(--gold); color:#1a1408; font-weight:700;
    text-decoration:none; border-radius:12px;
  }
  a.back { display:inline-block; margin-top:18px; color:var(--gold); }

  <h1>Save this for X</h1>
