<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F2744">
<title>Book Overstreet Cleaning</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .app { padding-bottom: 24px; }
  .hero { background: var(--navy); color: var(--ivory); padding: 28px 18px; padding-top: max(28px, env(safe-area-inset-top)); }
  .hero h1 { font-family: Fraunces, serif; font-size: 28px; }
  .hero p { color: rgba(244,241,234,.8); margin-top: 8px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 40px; }
</style>
</head>
<body>
<div class="hero">
  <h1>Book a clean</h1>
  <p>Overstreet Cleaning Solutions · Request a time. Aida will confirm by text.</p>
</div>
<div class="wrap">
  <p class="lede">Standard clean does not include baseboards, blinds, windows, or the inside of appliances — add those below if you want them.</p>
  <form id="f">
    <div class="field"><label>Your name</label><input name="name" required></div>
    <div class="field"><label>Mobile</label><input name="phone" type="tel" required></div>
    <div class="field"><label>Email</label><input name="email" type="email"></div>
    <div class="field"><label>Address</label><input name="address" required></div>
    <div class="field"><label>Square footage</label><input name="sqft" inputmode="numeric"></div>
    <div class="field"><label>Bedrooms</label><input name="beds" inputmode="numeric"></div>
    <div class="field"><label>Bathrooms</label><input name="baths" inputmode="numeric"></div>
    <div class="field"><label>Stories</label><input name="stories" inputmode="numeric"></div>
    <div class="field"><label>Pets</label><input name="pets" placeholder="Type, and where they will be during the clean"></div>
    <div class="field"><label>How we get in</label><input name="access" placeholder="Someone home, lockbox, garage code…"></div>
    <div class="field"><label>Type of clean</label>
      <select name="type">
        <option value="Regular">Regular</option>
        <option value="Deep clean">Deep clean</option>
        <option value="Airbnb / turnover">Airbnb / turnover</option>
        <option value="Post-construction">Post-construction</option>
        <option value="Organization">Organization</option>
      </select>
    </div>
    <div class="field"><label>Add-ons</label>
      <div class="choices">
        <label class="choice"><input type="checkbox" name="x" value="Baseboards"><span>Baseboards</span></label>
        <label class="choice"><input type="checkbox" name="x" value="Blinds"><span>Blinds</span></label>
        <label class="choice"><input type="checkbox" name="x" value="Interior windows"><span>Interior windows</span></label>
        <label class="choice"><input type="checkbox" name="x" value="Exterior windows"><span>Exterior windows</span></label>
        <label class="choice"><input type="checkbox" name="x" value="Inside fridge"><span>Inside fridge</span></label>
        <label class="choice"><input type="checkbox" name="x" value="Inside oven"><span>Inside oven</span></label>
        <label class="choice"><input type="checkbox" name="x" value="Inside microwave"><span>Inside microwave</span></label>
        <label class="choice"><input type="checkbox" name="x" value="Ceiling fans"><span>Ceiling fans</span></label>
        <label class="choice"><input type="checkbox" name="x" value="Basement"><span>Basement</span></label>
        <label class="choice"><input type="checkbox" name="x" value="Patio"><span>Patio / deck</span></label>
        <label class="choice"><input type="checkbox" name="x" value="Wash / fold laundry"><span>Wash / fold laundry</span></label>
      </div>
    </div>
    <div class="field"><label>Preferred date</label><input name="date" type="date"></div>
    <div class="field"><label>Preferred time</label><input name="time" type="time"></div>
    <div class="field"><label>Anything we should not touch, or special surfaces?</label><textarea name="notes"></textarea></div>
    <button class="btn primary full" type="submit">Send request by text</button>
    <p class="hint" id="st" style="margin-top:12px"></p>
  </form>
</div>
<script>
const to = new URLSearchParams(location.search).get('to') || '';
document.getElementById('f').onsubmit = (e) => {
  e.preventDefault();
  const f = e.target;
  const extras = [...f.querySelectorAll('[name=x]:checked')].map(i => i.value).join(', ') || 'none';
  const body = [
    'New Overstreet booking request',
    'Name: ' + f.name.value,
    'Phone: ' + f.phone.value,
    'Email: ' + f.email.value,
    'Address: ' + f.address.value,
    'Sq ft: ' + f.sqft.value + ' · ' + f.beds.value + ' bd / ' + f.baths.value + ' ba · ' + f.stories.value + ' stories',
    'Pets: ' + f.pets.value,
    'Access: ' + f.access.value,
    'Type: ' + f.type.value,
    'Extras: ' + extras,
    'Preferred: ' + f.date.value + ' ' + f.time.value,
    'Notes: ' + f.notes.value,
  ].join('\n');
  const st = document.getElementById('st');
  if (!to) {
    st.textContent = 'This page needs Aida’s booking link (with her number). You can still copy the details and text her.';
    navigator.clipboard.writeText(body).then(() => { st.textContent += ' Copied.'; }).catch(() => {});
    return;
  }
  const n = to.replace(/[^\d+]/g, '');
  location.href = 'sms:' + n + '?body=' + encodeURIComponent(body);
};
</script>
</body>
</html>
